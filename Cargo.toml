[package]
name = "pastel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["cozyfire", "tonigineer"]
description = "Recolors Factorio's graphics into a brighter, pastel look."
readme = "README.md"
publish = false

[lib]
name = "pastel"
path = "src/lib.rs"

[[bin]]
name = "pastel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
csv = "1"
flate2 = "1"
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
sha1_smol = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

# Clippy: the default lint set (no extra groups); `cargo clippy` must be clean.
