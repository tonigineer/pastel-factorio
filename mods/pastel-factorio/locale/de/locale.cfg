[mod-name]
pastel-factorio=Pastel Factorio

[mod-description]
pastel-factorio=Helle, sanfte Pastellfarben für alle Planeten und Gebäude: Gelände, Wasser und andere Flüssigkeiten, Erze, Pflanzen, Kreaturen, Gebäude, Icons und Nachtbeleuchtung, dazu schwarze Gummi-Förderbänder in pastellfarbenen Stufenfarben. Rein optisch.

[mod-setting-name]
pastel-factorio-graphics=Pastellgrafik
pastel-factorio-water-strength=Stärke der Wasserfarbe
pastel-factorio-water-color=Wasserfarbe
pastel-factorio-water-deep-color=Farbe des tiefen Wassers

[mod-setting-description]
pastel-factorio-graphics=Verwendet die umgefärbten Grafiken und Flüssigkeitsfarben für alle Planeten, Gebäude, Förderbänder, Icons und die Nachtbeleuchtung. Ausschalten, um nur die Wasserfarben von Nauvis zu behalten.
pastel-factorio-water-strength=Wie weit das Wasser von seiner Originalfarbe zu den Farben unten verschoben wird. 0 = Original, 1 = vollständig die neue Farbe.
pastel-factorio-water-color=Zielfarbe für normales und flaches Wasser, als Hex-Code wie #7FDDE6.
pastel-factorio-water-deep-color=Zielfarbe für tiefes Wasser, als Hex-Code wie #4FC3D9.
