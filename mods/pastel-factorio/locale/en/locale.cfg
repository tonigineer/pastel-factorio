[mod-name]
pastel-factorio=Pastel Factorio

[mod-description]
pastel-factorio=Bright, soft pastel colors for every planet and building: terrain, water and other liquids, ores, plants, creatures, buildings, icons and night lighting, with black rubber belts in pastel tier colors. Purely visual.

[mod-setting-name]
pastel-factorio-graphics=Pastel graphics
pastel-factorio-water-strength=Water color strength
pastel-factorio-water-color=Water color
pastel-factorio-water-deep-color=Deep water color

[mod-setting-description]
pastel-factorio-graphics=Use the recolored sprites and liquid colors for every planet, building, belt, icon and the night lighting. Turn off to keep only the Nauvis water colors.
pastel-factorio-water-strength=How far to move water from its vanilla color toward the colors below. 0 = vanilla, 1 = fully the new color.
pastel-factorio-water-color=Target color for normal and shallow water, as a hex code like #7FDDE6.
pastel-factorio-water-deep-color=Target color for deep water, as a hex code like #4FC3D9.
