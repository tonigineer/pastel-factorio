# How pastel recolors the game: paths, groups, categories, and which category
# every PNG belongs to. Your own settings (which groups to recolor, colors,
# brightness, liquids) are in settings.toml; its values win over this file's.
#
# Tune with:   just preview <file> --watch
# then edit either file and save; the preview re-renders.
#
# Lightness (L) runs 0 (black) to 1 (white). Chroma (C) is colorfulness:
# 0 is gray, ~0.1 is a clear pastel, ~0.25 is vivid. Hue (h) is an angle in
# degrees on the OKLCH wheel: ~30 red, ~60 orange/brown, ~100 yellow,
# ~140 green, ~200 cyan, ~260 blue, ~300 purple, ~350 pink.

[paths]
# Factorio install directory (the one containing data/ and bin/). A leading ~ is expanded.
factorio_dir = "/games/steamapps/common/Factorio"
# Factorio user data directory (the one containing mods/).
# ~/.factorio on Linux, ~/Library/Application Support/factorio on Mac, %APPDATA%\Factorio on Windows.
factorio_user_dir = "~/.factorio"

# =============================================================================
# Groups: what gets recolored. Each file belongs to the first group with a
# pattern that matches it; switch groups on and off in settings.toml. A
# group's `category` is used for its files that no rule under [classify]
# matches; the rules handle the exceptions.
# =============================================================================

[[groups]]
name = "vulcanus"
category = "vulcanus.ground"
match = [
  "space-age/graphics/terrain/{vulcanus,lava-transitions}/**",
  "space-age/graphics/terrain/{cliffs,craters}/vulcanus/**",
  "space-age/graphics/terrain/water-transitions/{lava-stone*,foundation-transitions-lava*}",
  "space-age/graphics/terrain/out-of-map-transition/{volcanic-*,lava-*,*-lava-*}",
  "space-age/graphics/decorative/{calcite-stain,demolisher-corpse,small-volcanic-rock,sulfur-stain,sulfuric-acid-puddle,tiny-volcanic-rock*,vulcanus-*,waves-relief}/**",
  "space-age/graphics/entity/{calcite,demolisher,lavaslug,sulfuric-acid-geyser,tungsten-ore}/**",
  "space-age/graphics/entity/plant/ashland-trees/**",
  "space-age/graphics/particle/{calcite,demolisher,lava,tungsten-ore}-particle/**",
  "space-age/graphics/space/vulcanus*.png",
  "space-age/graphics/lut/vulcanus-*.png",
]

[[groups]]
name = "fulgora"
category = "fulgora.ground"
match = [
  "space-age/graphics/terrain/{fulgoran-*,oil-*}.png",
  "space-age/graphics/terrain/cliffs/fulgora/**",
  "space-age/graphics/terrain/water-transitions/fulgora-*",
  "space-age/graphics/terrain/out-of-map-transition/{fulgora-*,oil-*}",
  "space-age/graphics/decorative/{fulgora-*,fulgoran-*,fulgurite,urchin-cactus}/**",
  "space-age/graphics/entity/{scrap,lightning}/**",
  "space-age/graphics/particle/holmium-ore-particle/**",
  "space-age/graphics/space/fulgora*.png",
  "space-age/graphics/lut/fulgora-*.png",
]

[[groups]]
name = "gleba"
category = "gleba.ground"
match = [
  "space-age/graphics/terrain/gleba/**",
  "space-age/graphics/terrain/cliffs/gleba/**",
  "space-age/graphics/terrain/{natural,artificial,overgrowth}-*.png",
  "space-age/graphics/terrain/out-of-map-transition/gleba-*",
  "space-age/graphics/decorative/{barnacles-decal,barney,black-sceptre,blood-grape*,bob-fingers,bramble,brown-cup,coral*,curly-root-grey,fuchsia-pita,gleba-*,green-cup,green-lettuce-lichen*,grey-cracked-mud-decal,honeycomb-fungus*,matches-small,mycelium,nerve-roots*,orange-root,pale-lettuce-lichen*,pink-phalanges,polycephalum,red-lichen-decal,split-gill*,veins*,white-carpet-grass,wispy-lichen}/**",
  "space-age/graphics/entity/{stromatolite,wriggler,strafer,stomper,gleba-spawner,rain}/**",
  "space-age/graphics/entity/plant/{boompuff,cuttlepop,funneltrunk,hairyclubnub,jellystem,lickmaw,slipstack,stingfrond,sunnycomb,teflilly,water-cane,yumako-tree}/**",
  "space-age/graphics/particle/{gleba-blood,gleba-tree,pentapod}-particle/**",
  "space-age/graphics/space/gleba*.png",
  "space-age/graphics/lut/gleba-*.png",
]

[[groups]]
name = "aquilo"
category = "aquilo.ground"
match = [
  "space-age/graphics/terrain/aquilo/**",
  "space-age/graphics/terrain/water-transitions/ice*",
  "space-age/graphics/terrain/out-of-map-transition/ice-*",
  "space-age/graphics/decorative/{aquilo-*,lithium-iceberg-*,snow-drift-decal}/**",
  "space-age/graphics/entity/{fluorine-vent,lithium-brine,snow}/**",
  "space-age/graphics/space/aquilo*.png",
]

[[groups]]
name = "space"                 # space platforms, foundation and asteroids
category = "space.platform"
match = [
  "space-age/graphics/terrain/{space-platform,foundation}/**",
  "space-age/graphics/terrain/empty-space.png",
  "space-age/graphics/terrain/{water-transitions,out-of-map-transition}/foundation*",
  "space-age/graphics/decorative/space-platform-decorative/**",
  "space-age/graphics/entity/{asteroid,asteroid-explosions}/**",
  "space-age/graphics/particle/asteroid-particle/**",
  "space-age/graphics/space/asteroid*.png",
]

[[groups]]
name = "nauvis"                # terrain, nature, enemies, resources and lighting
category = "entity"
match = [
  "base/graphics/{terrain,decorative,particle}/**",
  "base/graphics/entity/{acid-projectile,acid-splash,acid-sticker,biter,spawner,spitter,worm,tree,fish,iron-ore,copper-ore,coal,stone,uranium-ore,crude-oil}/**",
  "space-age/graphics/entity/plant/{planted-tree,tree-plant}/**",
  "space-age/graphics/space/nauvis*.png",
  "core/graphics/color_luts/**",
]

[[groups]]
name = "icons"                 # icons, technologies and other GUI art
category = "icon"
match = ["*/graphics/{icons,technology,achievement,equipment,item-group}/**"]

[[groups]]
name = "buildings"             # every building, vehicle and effect, all expansions
category = "entity"
match = ["*/graphics/{entity,particle}/**"]

# Liquid tiles drawn by a shader: their color comes from the game data, not
# from a PNG. Their target colors and strengths are in settings.toml. Nauvis
# water has its own in-game settings.
[liquids]
lava = { group = "vulcanus", tiles = ["lava", "lava-hot"] }
oil = { group = "fulgora", tiles = ["oil-ocean-deep", "oil-ocean-deep-2"] }
wetland = { group = "gleba", tiles = [
  "gleba-deep-lake", "wetland-blue-slime", "wetland-dead-skin", "wetland-green-slime", "wetland-jellynut",
  "wetland-light-dead-skin", "wetland-light-green-slime", "wetland-pink-tentacle", "wetland-red-tentacle", "wetland-yumako",
  "lowland-brown-blubber", "lowland-cream-cauliflower", "lowland-cream-cauliflower-2", "lowland-cream-red",
  "lowland-dead-skin", "lowland-dead-skin-2", "lowland-olive-blubber", "lowland-olive-blubber-2", "lowland-olive-blubber-3",
  "lowland-pale-green", "lowland-red-infection", "lowland-red-vein", "lowland-red-vein-2", "lowland-red-vein-3",
  "lowland-red-vein-4", "lowland-red-vein-dead",
] }
ammonia = { group = "aquilo", tiles = ["ammoniacal-ocean", "ammoniacal-ocean-2"] }
brash_ice = { group = "aquilo", tiles = ["brash-ice"] }

# =============================================================================
# Categories. Every category used in the rules at the bottom is defined here.
# `inherit = "other"` starts from another category's settings; nested tables
# (like `spread`) merge key by key.
# =============================================================================

[categories.passthrough]
type = "passthrough"

# ------------------------------------------------------------------- terrain
# 'transfer' moves the category's median color (measured over all of its
# files) to `target`, and scales the variation around it by `spread`
# (1 = keep vanilla variation, <1 flatter, >1 more contrast).
# per_file_match (0..1): also measure each main tile sheet on its own and
# move it toward the target, so sheets that start cooler/yellower than their
# siblings don't stand out. 0 = off.
[categories."terrain.grass"]
type = "transfer"
target = "$grass"
spread = { L = 1.15, C = 1.0, h = 0.35 }   # original h: 0.5
soft_max = 0.88               # roll off highlights instead of clipping to white
per_file_match = 0.7          # pull each grass sheet's own average toward the target
                              # (0 = one shared adjustment, 1 = all sheets identical on average)

[categories."terrain.dirt"]
type = "transfer"
target = "$dirt"
spread = { L = 1.0, C = 1.0, h = 1.0 }

[categories."terrain.sand"]   # sand is already very light, so cap highlights so grains stay cream, not white
inherit = "terrain.dirt"
target = "$sand"
spread = { L = 0.85 }         # slightly less light/dark spread than dirt (1.0)
soft_max = 0.9                # roll off highlights instead of clipping to white

[categories."terrain.red_desert"]
inherit = "terrain.dirt"
target = "$red_desert"

[categories."terrain.landfill"]
inherit = "terrain.dirt"
target = "$landfill"

[categories."terrain.nuclear"]
inherit = "terrain.dirt"
target = "$nuclear"

[categories."terrain.stone_path"]
inherit = "terrain.dirt"
target = "$stone_path"

[categories."terrain.concrete"]
inherit = "terrain.dirt"
target = "$concrete"
spread = { L = 0.9, C = 0.5, h = 0.3 }

[categories."terrain.refined_concrete"]
inherit = "terrain.concrete"
target = "$refined_concrete"

[categories."terrain.water"]
type = "transfer"
target = "$water"
spread = { L = 2.2, C = 1.2, h = 0.6 }

[categories."terrain.deepwater"]
inherit = "terrain.water"
target = "$deepwater"

[categories."terrain.water_green"]
inherit = "terrain.water"
target = "$water_green"

[categories."terrain.deepwater_green"]
inherit = "terrain.water"
target = "$deepwater_green"

[categories."terrain.water_shallow"]
inherit = "terrain.water"
target = "$water_shallow"

[categories."terrain.water_mud"]
inherit = "terrain.water"
target = "$water_mud"

[categories."terrain.hazard"]  # yellow stripes go butter yellow, dark stripes stay dark (soft plum)
type = "remap"
lift = { floor = 0.62, ceil = 0.98, gamma = 0.8 }
hue_anchors = [[80, 92]]
chroma = { scale = 1.15, max = 0.15 }
muted = { below = 0.018, above = 0.032, blur = 1.0, lift = { floor = 0.26, ceil = 0.52, gamma = 1.0 }, neutral = { chroma_below = 0.07, hue = 305, chroma = 0.035 }, chroma = { scale = 0.3, max = 0.05 } }

# ---------------------------------------------------------------------- ores
[categories."ore.iron"]
type = "transfer"
strength = 0.5                # halfway between vanilla and the full recolor
target = "$iron"
spread = { L = 1.05, C = 0.6, h = 0.25 }
soft_max = 0.9

[categories."ore.copper"]
inherit = "ore.iron"
target = "$copper"

[categories."ore.coal"]
inherit = "ore.iron"
target = "$coal"

[categories."ore.stone"]
inherit = "ore.iron"
target = "$stone"

[categories."ore.uranium"]
inherit = "ore.iron"
target = "$uranium"

[categories."ore.oil"]
inherit = "ore.iron"
target = "$oil"

# ------------------------------------------------------------------ entities
# 'remap' settings:
#   lift:   L' = floor + (ceil - floor) * L^gamma. Higher floor = brighter darks.
#   detail: sigma = blur radius in pixels for the lift; gain > 1 re-adds a
#           little extra texture so lifted sprites don't look flat.
#           color_blur smooths color (not lightness) over this many pixels,
#           so gray grain doesn't become rainbow speckle; cleaner flat color.
#   hue_anchors: [from, to] hue pairs; hues in between are interpolated.
#   hue_chroma_range: [lo, hi]; the hue remap applies fully to colors less
#           colorful than lo and not at all above hi, so bright accent
#           colors (belt yellow, inserter blue) keep their hue.
#   neutral: grays (chroma below chroma_below) get this hue and chroma.
#   shade:  areas that were darker than `below` lean toward this hue,
#           so shading reads as cool lavender instead of black.
#   chroma: C' = min(C * scale + add, max)
#   strength: how much of the recolor to apply. 1 = full, 0.5 = halfway
#           between vanilla and full, 0 = vanilla. Works on every
#           remap and transfer category, and is inherited.
#   outline: within `width` pixels of the sprite's edge, pull lightness back
#           toward the original dark contour (strength 0..1), so sprites stay
#           crisp against the light ground.
[categories.entity]
type = "remap"
strength = 0.5                # halfway between vanilla (0) and the full recolor (1)
lift = { floor = 0.25, ceil = 0.97, gamma = 0.7 }
detail = { sigma = 2.0, gain = 1.2, color_blur = 1.5 }
hue_anchors = [[40, 50], [75, 62], [110, 150], [170, 185], [250, 250], [320, 330]]
hue_chroma_range = [0.05, 0.11]
neutral = { chroma_below = 0.035, hue = 265, chroma = 0.028 }
shade = { hue = 295, below = 0.30, strength = 0.8, chroma = 0.05 }
chroma = { scale = 1.5, add = 0.015, max = 0.18 }
outline = { width = 2.0, strength = 0.6 }

[categories.enemy]
inherit = "entity"
lift = { floor = 0.33 }
neutral = { hue = 330, chroma = 0.03 }
shade = { hue = 320 }
chroma = { max = 0.13 }

[categories.technology]
inherit = "entity"
lift = { floor = 0.32 }

[categories.icon]
inherit = "entity"
detail = { sigma = 0, color_blur = 0 }   # icons are small; no blur
outline = { width = 1.0 }

[categories."icon.gui"]       # signals, arrows, fluids, achievements: light touch
type = "remap"
lift = { floor = 0.12, ceil = 1.0, gamma = 0.95 }
chroma = { scale = 0.95, max = 0.3 }

[categories.light]            # additive glow layers: no lift, slightly softer
type = "remap"
chroma = { scale = 0.9, max = 0.35 }

[categories.effect]
inherit = "light"

# -------------------------------------------------------------------- nature
[categories.foliage]
type = "remap"
strength = 0.5
lift = { floor = 0.42, ceil = 0.97, gamma = 0.8 }
detail = { sigma = 1.5, gain = 1.15 }
hue_anchors = [[60, 95], [100, 128], [140, 145], [180, 170]]
shade = { hue = 200, below = 0.25, strength = 0.5, chroma = 0.03 }
chroma = { scale = 1.25, add = 0.01, max = 0.16 }

[categories."foliage.ground"]  # green grass tufts and small bushes on the ground
type = "transfer"              # like terrain: move every tuft to one bright green
strength = 0.6                 # 60% of the way from vanilla to the new green
target = "$foliage_ground"
spread = { L = 0.85, C = 0.8, h = 0.25 }  # low hue spread: yellowish patches don't drift back to lime
soft_max = 0.8                 # cap highlights lower so bright spots stay green, not white

[categories."foliage.dry"]
inherit = "foliage"
hue_anchors = [[50, 72], [90, 88], [130, 115]]
chroma = { scale = 1.0, max = 0.12 }

[categories."foliage.red"]
inherit = "foliage"
hue_anchors = [[20, 15], [40, 30], [100, 125]]

[categories.wood]
inherit = "foliage"
hue_anchors = [[50, 58], [90, 75]]
shade = { hue = 300 }
chroma = { scale = 1.1, max = 0.11 }

[categories.rock]
type = "remap"
strength = 0.5
lift = { floor = 0.45, ceil = 0.97, gamma = 0.8 }
detail = { sigma = 2.0, gain = 1.2 }
neutral = { chroma_below = 0.04, hue = 75, chroma = 0.03 }
shade = { hue = 295, below = 0.35, strength = 0.8, chroma = 0.04 }
chroma = { scale = 1.0, max = 0.09 }

# --------------------------------------------------------------------- belts
# Black rubber with pastel tier colors: grayish pixels (the rubber and its
# frame) use the `muted` settings and go dark; colored pixels (the arrows)
# use the category's own settings and go pastel. The arrows keep their shape.
[categories.belt]
type = "remap"
lift = { floor = 0.5, ceil = 0.96, gamma = 0.85 }
hue_anchors = [[25, 20], [70, 95], [150, 150], [255, 245]]   # yellow-orange arrows -> clear pastel yellow; red and blue keep their hue
chroma = { scale = 1.0, max = 0.16 }
muted = { below = 0.05, above = 0.1, blur = 0.75, lift = { floor = 0.18, ceil = 0.5, gamma = 1.0 }, detail = { sigma = 1.0, gain = 1.3 }, neutral = { chroma_below = 0.1, hue = 285, chroma = 0.018 }, chroma = { scale = 0.15, max = 0.025 } }

# ------------------------------------------------------------------ planets
# The other planets keep their identity, just lighter and softer. Each
# planet's group uses its *.ground category for everything without a rule.
[categories."vulcanus.ground"]    # basalt and ash: nearly vanilla, with a soft lavender tint on the pumice
type = "remap"
strength = 0.1                # low: a stronger lift turns the ground into a foggy haze
lift = { floor = 0.2, ceil = 0.93, gamma = 0.7 }
detail = { sigma = 2.0, gain = 1.5 }
neutral = { chroma_below = 0.05, hue = 20, chroma = 0.028 }
shade = { hue = 320, below = 0.3, strength = 0.6, chroma = 0.03 }
chroma = { scale = 1.4, add = 0.005, max = 0.2 }

[categories."vulcanus.lava"]      # the lava's own picture: kept close to the vanilla glow
type = "remap"
strength = 0.05
lift = { floor = 0.3, ceil = 0.97, gamma = 0.85 }
hue_anchors = [[50, 35]]
neutral = { chroma_below = 0.04, hue = 330, chroma = 0.03 }
chroma = { scale = 1.1, max = 0.2 }

[categories."fulgora.oil"]        # the oil ocean's surface: dark lilac instead of black-brown
type = "remap"
strength = 0.75
lift = { floor = 0.3, ceil = 0.85, gamma = 0.9 }
neutral = { chroma_below = 0.06, hue = 300, chroma = 0.05 }
chroma = { scale = 1.0, max = 0.1 }

[categories."fulgora.ground"]     # rust-red sand, rock and ruins: close to vanilla, a little lighter and rosier
type = "remap"
strength = 0.3                # low: a stronger lift turns the ground into a foggy haze
lift = { floor = 0.2, ceil = 0.95, gamma = 0.7 }
detail = { sigma = 2.0, gain = 1.5 }
hue_anchors = [[35, 18]]
neutral = { chroma_below = 0.03, hue = 15, chroma = 0.025 }
chroma = { scale = 1.4, max = 0.2 }

[categories."gleba.ground"]       # organic yellows, greens, reds and turquoise: candy pastels
type = "remap"
strength = 0.7
lift = { floor = 0.42, ceil = 0.97, gamma = 0.8 }
detail = { sigma = 1.5, gain = 1.15 }
shade = { hue = 320, below = 0.28, strength = 0.5, chroma = 0.03 }
chroma = { scale = 1.15, add = 0.01, max = 0.15 }

[categories."aquilo.ground"]      # snow, ice and dust: icy lilac and periwinkle
type = "remap"
strength = 0.75
lift = { floor = 0.48, ceil = 0.98, gamma = 0.85 }
detail = { sigma = 2.0, gain = 1.1 }
hue_anchors = [[240, 255]]
neutral = { chroma_below = 0.04, hue = 280, chroma = 0.03 }
chroma = { scale = 1.1, max = 0.12 }

[categories."space.platform"]     # platform plates and foundation: light lavender metal
type = "remap"
strength = 0.6
lift = { floor = 0.5, ceil = 0.97, gamma = 0.8 }
detail = { sigma = 1.5, gain = 1.15 }
neutral = { chroma_below = 0.05, hue = 285, chroma = 0.025 }
chroma = { scale = 1.0, max = 0.1 }

[categories."planet.resource"]    # tungsten, calcite, scrap, stromatolites, vents, asteroids
type = "remap"                    # lighter, but each keeps its own color so they stay easy to tell apart
strength = 0.6
lift = { floor = 0.4, ceil = 0.97, gamma = 0.8 }
detail = { sigma = 1.5, gain = 1.2 }
neutral = { chroma_below = 0.03, hue = 290, chroma = 0.02 }
chroma = { scale = 1.25, add = 0.005, max = 0.16 }

[categories."planet.globe"]       # the planets as seen from orbit
type = "remap"
strength = 0.6
lift = { floor = 0.3, ceil = 0.97, gamma = 0.85 }
chroma = { scale = 1.1, max = 0.15 }

# ------------------------------------------------------------------- special
[categories.shadow]
type = "shadow"
alpha_scale = 0.6             # 1 = vanilla darkness, 0 = no shadows
tint = "$shadow"              # may be ignored by the game; the lower opacity still applies

[categories.lut]
type = "lut"
# Files not listed here are left unchanged.
#   softness: 0..1, how far to pull the grading back toward "no grading"
#   moon / moon_strength: lifts the darkest colors toward this color
#   tint / tint_strength: color cast over everything
[categories.lut.files]
"lut-night.png"  = { softness = 0.2, moon = "$moon", moon_strength = 0.25 }
"night.png"      = { softness = 0.2, moon = "$moon", moon_strength = 0.25 }
"lut-dawn.png"   = { softness = 0.30, tint = "$dusk", tint_strength = 0.25 }
"lut-sunset.png" = { softness = 0.30, tint = "$dusk", tint_strength = 0.25 }
# The other planets: lighter days, softer nights.
"vulcanus-1-day.png"          = { softness = 0.35 }
"vulcanus-2-night.png"        = { softness = 0.25, moon = "$moon", moon_strength = 0.2 }
"fulgora-1-noon.png"          = { softness = 0.6 }   # Fulgora's day grading is dark and muddy
"fulgora-2-afternoon.png"     = { softness = 0.6 }
"fulgora-3-after-sunset.png"  = { softness = 0.25, moon = "$moon", moon_strength = 0.2 }
"fulgora-4-before-dawn.png"   = { softness = 0.25, moon = "$moon", moon_strength = 0.2 }
"fulgora-5-morning.png"       = { softness = 0.6 }
"gleba-1-noon.png"            = { softness = 0.2 }
"gleba-2-afternoon.png"       = { softness = 0.2 }
"gleba-3-late-afternoon.png"  = { softness = 0.2 }
"gleba-4-sunset.png"          = { softness = 0.25, tint = "$dusk", tint_strength = 0.2 }
"gleba-5-after-sunset.png"    = { softness = 0.25, moon = "$moon", moon_strength = 0.2 }
"gleba-6-before-dawn.png"     = { softness = 0.25, moon = "$moon", moon_strength = 0.2 }
"gleba-7-dawn.png"            = { softness = 0.25, tint = "$dusk", tint_strength = 0.2 }
"gleba-8-morning.png"         = { softness = 0.2 }

# =============================================================================
# Rules: which category each PNG belongs to.
#
# Paths are relative to data/, e.g. base/graphics/terrain/grass-1.png
# Rules are checked top to bottom and the FIRST match wins, so specific rules
# go above general ones. Patterns: ** = any number of folders, * = anything
# within one folder name, {a,b} = either a or b. Matching ignores case.
#
# Every PNG must match some rule. If one doesn't, the build stops and lists it.
# =============================================================================
[classify]
# Parts of files that are never recolored: every column from x_from to the
# right edge. Tile transition sheets hold three layers side by side (overlay,
# background and a grayscale mask). The mask decides where one tile cuts into
# the other; it is data, not color. The list comes from the game's own
# prototype data; regenerate it with `just scan` after a game update.
keep = [
  # BEGIN generated keep (`just scan`)
  { match = "base/graphics/terrain/out-of-map-transition/concrete-out-of-map-transition-b.png", x_from = 2048 },
  { match = "base/graphics/terrain/out-of-map-transition/concrete-out-of-map-transition.png", x_from = 2048 },
  { match = "base/graphics/terrain/out-of-map-transition/concrete-shore-out-of-map-transition.png", x_from = 2048 },
  { match = "base/graphics/terrain/out-of-map-transition/dark-dirt-shore-out-of-map-transition.png", x_from = 2176 },
  { match = "base/graphics/terrain/out-of-map-transition/dirt-out-of-map-transition.png", x_from = 2176 },
