rules = [
  # ===== 1. Never recolor: data, not color ====================================
  { match = "base/graphics/icons/quality-normal.png", category = "icon" },   # an icon, not a normal map
  { match = "**/*-normal.png",                   category = "passthrough" },   # tree normal maps (lighting data)
  { match = "**/*mask*.png",                     category = "passthrough" },   # multiplied by player / fluid / enemy tint
  { match = "**/*tint*.png",                     category = "passthrough" },   # tintable, tinted, to-tint layers
  { match = "**/*-spec.png",                     category = "passthrough" },   # specular (shine) maps
  { match = "base/graphics/terrain/effect-maps/**", category = "passthrough" },
  { match = "base/graphics/terrain/effects/**",  category = "passthrough" },
  { match = "base/graphics/terrain/masks/**",    category = "passthrough" },
  # Space Age: the planet globes are recolored; the rest of the sky, the
  # weather, logos and space backdrops stay as they are. Frozen belts stay
  # icy: the black rubber treatment would turn their ice black.
  { match = "space-age/graphics/space/{nauvis,vulcanus,fulgora,gleba,aquilo}.png", category = "planet.globe" },
  { match = "space-age/graphics/space/asteroidTexture.png", category = "planet.resource" },
  { match = "space-age/graphics/{space,procession,sticker}/**", category = "passthrough" },
  { match = "space-age/graphics/terrain/{empty-space.png,effect-maps/**,masks/**}", category = "passthrough" },
  { match = "space-age/graphics/entity/{rain,snow,beam,lightning,capture-robot-rocket,factorio-space-age-logo,wube-logo-space-platform}/**", category = "passthrough" },
  { match = "space-age/graphics/entity/frozen/{transport-belt,fast-transport-belt,express-transport-belt}/**", category = "passthrough" },
  { match = "space-age/graphics/entity/turbo-transport-belt/*-frozen.png", category = "passthrough" },
  { match = "space-age/graphics/*.png",          category = "passthrough" },   # logo

  # ===== 2. core: GUI stays vanilla; only the color LUTs change ===============
  { match = "core/graphics/color_luts/*.png",    category = "lut" },
  { match = "core/graphics/**",                  category = "passthrough" },

  # ===== 3. Special blend layers ===============================================
  { match = "**/*shadow*.png",                   category = "shadow" },
  # From the game's own prototype data (file names don't say how a file is
